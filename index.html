<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="waves" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>

  <div class="petals" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span>
  </div>

  <button type="button" id="lang" class="lang" aria-label="Change language">العربية</button>

  <main class="card">
    <h1 data-i18n="title">Welcome back</h1>
    <p class="sub" data-i18n="sub">Log in to pick up where you left off</p>

    <form id="loginForm" novalidate>
      <label for="email" data-i18n="email">Email</label>
      <input id="email" type="email" placeholder="name@example.com" autocomplete="email" required>

      <label for="pass" data-i18n="password">Password</label>
      <div class="pass-wrap">
        <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" id="toggle" data-i18n="show">Show</button>
      </div>

      <button type="submit" class="login" data-i18n="login">Log in</button>
      <p id="msg" role="status"></p>
    </form>
  </main>

  <script>
    const T = {
      en: {
        title: 'Welcome back', sub: 'Log in to pick up where you left off',
        email: 'Email', password: 'Password', show: 'Show', hide: 'Hide',
        login: 'Log in', ok: 'Logged in (demo only)',
        err: 'Check your email and password (at least 4 characters)',
        btn: 'العربية', page: 'Login'
      },
      ar: {
        title: 'أهلاً بعودتك', sub: 'سجّلي دخولك لتكملين من حيث وقفتي',
        email: 'البريد الإلكتروني', password: 'كلمة المرور', show: 'إظهار', hide: 'إخفاء',
        login: 'دخول', ok: 'تم تسجيل الدخول (تجريبي)',
        err: 'تأكدي من البريد وكلمة المرور (٤ أحرف على الأقل)',
        btn: 'English', page: 'تسجيل الدخول'
      }
    };

    const pass = document.getElementById('pass');
    const toggle = document.getElementById('toggle');
    const msg = document.getElementById('msg');
    const langBtn = document.getElementById('lang');
    let lang = 'en';
    let state = null; // 'ok' | 'err' | null

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = t.page;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t[el.dataset.i18n];
      });
      toggle.textContent = pass.type === 'password' ? t.show : t.hide;
      langBtn.textContent = t.btn;
      msg.textContent = state ? t[state] : '';
      msg.className = state || '';
    }

    toggle.addEventListener('click', () => {
      pass.type = pass.type === 'password' ? 'text' : 'password';
      render();
    });

    langBtn.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      try { localStorage.setItem('lang', lang); } catch (e) {}
      render();
    });

    // Demo only: no server, just a confirmation message
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const ok = e.target.email.value.includes('@') && pass.value.length >= 4;
      state = ok ? 'ok' : 'err';
      render();
    });

    try { lang = localStorage.getItem('lang') || 'en'; } catch (e) {}
    render();
  </script>
</body>
</html>
